<html>
<head>
<title>User form</title>
<style>
body{
background-color:lightgreen;
margin-top:70px;
}
hover:label{
background-color:lightblue;
}
button{
background-color:lightyellow;
}
</style>
<script>
function useradd(){
	var id=document.getElementById("entityId").value;
	var name=document.getElementById("name").value;
	var phone=document.getElementById("phone").value;
	var email=document.getElementById("email").value;
	var address=document.getElementById("address").value;

	var user={
			id:id,
			name:name,
			phone:phone,
			email:email,
			address:address
	}
	
	fetch ("/users",{
			method:"POST",
			headers :{
				"Content-Type":"application/json"
			},
			
			body:JSON.stringify(user)
	})
	
	
	.then(function(response){
		return response.json();
	})

}

function deleteuser(){
	var id=document.getElementById("id").value;
	
	fetch("/users/" +id,{
	method:"DELETE"	
	}	
	)

}
</script>
</head>
<body>
<center>
<h1>Add user</h1>

<label>ID :</label>
<input type="number" id="entityId">
<br>
<label>Name :</label>
<input type="text" id="name">
<br>
<label>Phone :</label>
<input type="number" id="phone">
<br>
<label>E-mail :</label>
<input type="text" id="email">
<br>
<label>Address :</label>
<input type="text" id="address">
<br>
<br>
<button onClick="useradd()">Click to add</button>
<br>

<h2>delete user</h2>

<label>Id ; </label>
<input type="number" id="id"><br><br><br>
<button onClick="deleteuser()">Click to delete</button>
<br><br>
<a href="/users">c lick to view </a>
<br><br>
<br>
</center>
</body>
</html>
